
<div class="header">
     <div class="flex-between">
        <div>
           <h2>
            Library System
           </h2>
        </div>
        <div>
            <button matButton [matMenuTriggerFor]="belowMenu">{{username}}</button>
                <mat-menu #belowMenu="matMenu" yPosition="below">
                    <button mat-menu-item (click)="logout()">Logout</button>
                </mat-menu>
        </div>
     </div>
</div>
<div class="flex">
   <div class="sidebar">
      <div class="items">
        @for(menu of menu; track menu.moduleName; let i = $index){
            <div class="item" [ngClass]="{'item-active':menu.isActive}" 
            (click)="selectedMenu(i)">
              <span>{{menu.moduleName}}</span>
           </div> 
        }
                
      </div>
   </div>
   <div class="container">
      <router-outlet></router-outlet>
   </div>
</div>
