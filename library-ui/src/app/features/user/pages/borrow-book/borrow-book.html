<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
    <form [formGroup]="borrowForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" style="min-width:45%; margin-bottom: 15px; margin-top: 20px;">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" formControlName="quantity">

            <mat-error *ngIf="f['quantity'].hasError('required')">
            Quantity is required
            </mat-error>

        </mat-form-field>

        <div formGroupName="range" style="margin-left: 15px; display: inline;">
               <mat-form-field appearance="outline" style="max-width:49%;" >
                        <mat-label>Borrow & Return Date</mat-label>

                        <mat-date-range-input [rangePicker]="picker">

                            <input
                            matStartDate
                            formControlName="start"
                            placeholder="Borrow Date">

                            <input
                            matEndDate
                            formControlName="end"
                            placeholder="Return Date">

                        </mat-date-range-input>

                        <mat-datepicker-toggle
                            matIconSuffix
                            [for]="picker">
                        </mat-datepicker-toggle>

                        <mat-date-range-picker #picker>
                        </mat-date-range-picker>

                        @if (borrowForm.get('range.start')?.hasError('required')) {
                            <mat-error>Borrow date is required</mat-error>
                        }

                        @if (borrowForm.get('range.end')?.hasError('required')) {
                            <mat-error>Return date is required</mat-error>
                        }

                </mat-form-field>
        </div>



</form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton  (click)="cancel()">Close</button>
  <button matButton  (click)="onSubmit()">Save</button>
</mat-dialog-actions>
