<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" style="min-width:45%; margin-bottom: 15px; margin-top: 20px;">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title">

            <mat-error *ngIf="f['title'].hasError('required')">
            Title is required
            </mat-error>

        </mat-form-field>
        <mat-form-field appearance="outline" style="min-width:50%; margin-left: 15px;">
            <mat-label>Author</mat-label>
            <input
            matInput
            type="text"
            formControlName="author">

            <mat-error *ngIf="f['author'].hasError('required')">
            Author is required
            </mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" style="min-width:45%;">
            <mat-label>ISBN</mat-label>
            <input matInput formControlName="isbn">

            <mat-error *ngIf="f['isbn'].hasError('required')">
            Isbn is required
            </mat-error>

        </mat-form-field>
        <mat-form-field appearance="outline" style="min-width:50%; margin-left: 15px;">
            <mat-label>Quantity</mat-label>
            <input
            matInput
            type="number"
            formControlName="quantity">

            <mat-error *ngIf="f['quantity'].hasError('required')">
            Quantity is required
            </mat-error>

        </mat-form-field>
       
        <mat-form-field appearance="outline" style="min-width:45%;">
            <mat-label>Department</mat-label>

            <mat-select formControlName="departmentId">
            <mat-option *ngFor="let dept of departments()" [value]="dept.id">
                {{ dept.name }}
            </mat-option>
            </mat-select>

            <mat-error *ngIf="f['departmentId'].hasError('required')">
            Department is required
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" style="min-width:50%; margin-left: 15px;">
            <mat-label>Status</mat-label>

            <mat-select formControlName="status">
            <mat-option *ngFor="let status of bookStatus" [value]="status">
                {{ status }}
            </mat-option>
            </mat-select>

            <mat-error *ngIf="f['status'].hasError('required')">
            Status is required
            </mat-error>
        </mat-form-field>


</form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton  (click)="cancel()">Close</button>
  <button matButton  (click)="onSubmit()">Save</button>
</mat-dialog-actions>
