apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true" # Enables regex routing safely
spec:
  ingressClassName: nginx # 👈 Modern way to specify your NGINX controller class
  rules:
    - http:
        paths:
          # 🚀 Fixed path syntax to work perfectly with regular expressions
          - path: /?(.*)
            pathType: ImplementationSpecific 
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

